[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nodocontador"
version = "0.1.0"
description = "Contador de producción con sensor fotoeléctrico para Raspberry Pi Zero W"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.8,<4",
]

[project.optional-dependencies]
gpio = ["gpiozero>=2,<3"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[project.scripts]
nodocontador = "nodocontador.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nodocontador = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
