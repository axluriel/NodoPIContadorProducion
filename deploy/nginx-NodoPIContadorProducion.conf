server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    auth_basic "NodoPIContador";
    auth_basic_user_file /etc/nginx/NodoPIContadorProducion.htpasswd;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 40s;
    client_max_body_size 512k;

    # Las consultas externas (central, SCADA, Power BI) usan su propia clave
    # X-Api-Key (ClaveConsulta) en lugar de la autenticación básica.
    location = /api/consulta/estado {
        auth_basic off;
        proxy_pass http://127.0.0.1:5000;
    }

    location = /api/consulta/minutos {
        auth_basic off;
        proxy_pass http://127.0.0.1:5000;
    }


    location / {
        proxy_pass http://127.0.0.1:5000;
    }
}
