name: Validar actualización

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Pruebas Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar proyecto y pruebas
        run: python -m pip install ".[dev]"
      - name: Ejecutar pruebas
        env:
          CONTADOR_GPIO_MOCK: "1"
        run: python -m pytest -q
